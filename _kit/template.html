<title>Aste Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap">
<style>
/* Aste Flow: assistente a chat per cercare casa all'asta. Domande a pulsanti, poi schede ricche e scheda completa. */
:root{--bg:#ece5dd;--card:#fff;--ink:#14202b;--muted:#5b6672;--line:#dce1e6;--brand:#1f4e79;--brand2:#e8eff6;--g:#075e54;--g2:#dcf8c6;--on:#fff;--wa:#8a4b0a;--wabg:#fdf1dc;--ok:#166534;--okbg:#dcfce7;--soft:#f2f4f6;--font:"Archivo",system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--card:#1f2c33;--ink:#e9edef;--muted:#8696a0;--line:#2a3942;--brand:#7fb0e0;--brand2:#1d3245;--g:#0f7a6f;--g2:#005c4b;--on:#fff;--wa:#fcd34d;--wabg:#3a2c0d;--ok:#86efac;--okbg:#14321f;--soft:#182229;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b141a;--card:#1f2c33;--ink:#e9edef;--muted:#8696a0;--line:#2a3942;--brand:#7fb0e0;--brand2:#1d3245;--g:#0f7a6f;--g2:#005c4b;--on:#fff;--wa:#fcd34d;--wabg:#3a2c0d;--ok:#86efac;--okbg:#14321f;--soft:#182229;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font)}
[hidden]{display:none!important}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hd{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;gap:12px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:800;flex:none}
.hd b{font-size:17px;display:block}.hd small{opacity:.85;font-size:12.5px}
.hd button{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:7px 12px;font:600 13px var(--font);cursor:pointer}
#chat{flex:1;padding:12px 12px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:9px 12px;border-radius:12px;font-size:15.5px;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.08);overflow-wrap:anywhere}
.m.in{background:var(--card);align-self:flex-start;border-top-left-radius:3px}
.m.out{background:var(--g2);align-self:flex-end;border-top-right-radius:3px}
.m small{display:block;color:var(--muted);font-size:13.5px;margin-top:4px}
.m a{color:var(--brand);font-weight:700}
.qr{display:flex;flex-wrap:wrap;gap:7px;align-self:flex-start;max-width:100%}
.qr button{background:var(--card);border:1.5px solid var(--g);color:var(--g);border-radius:999px;padding:9px 13px;font:600 14.5px var(--font);cursor:pointer;text-align:left}
.qr button span{color:var(--muted);font-weight:500;font-size:13px;margin-left:4px}
.qr button:disabled{opacity:.4;cursor:default}
.qr.big{width:100%}
.qr.big button{border-radius:14px;padding:11px 14px;display:flex;gap:12px;align-items:center;width:100%}
.qr.big button i{font-style:normal;font-size:24px}
.qr.big button b{display:block;font-size:15.5px;color:var(--ink)}
.qr.big button em{display:block;font-style:normal;font-weight:500;font-size:13px;color:var(--muted)}
.typing{align-self:flex-start;background:var(--card);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:14px}
.rc{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.1);width:100%}
.rc .top{background:linear-gradient(135deg,#1f4e79,#14324f);color:#fff;padding:12px 14px}
.rc .top small{opacity:.85;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.rc .top h3{margin:3px 0 2px;font-size:18px;line-height:1.2}
.rc .top .loc{font-size:13px;opacity:.9}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags b{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.18);font-weight:600}
.tags b.v{background:#dcfce7;color:#166534}
.rc .bd{padding:12px 14px;display:grid;gap:10px}
.big{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big .l{font-size:12.5px;color:var(--muted)}.big strong{display:block;font-size:26px;color:var(--brand);line-height:1.1}
.big .r{font-size:12.5px;color:var(--muted);text-align:right}
.val{background:var(--okbg);color:var(--ok);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.4}
.val.n{background:var(--soft);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid div{background:var(--soft);border-radius:10px;padding:7px 8px;min-width:0}
.grid b{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.grid span{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.grid .gok span{color:var(--ok)}
.miss{background:var(--wabg);color:var(--wa);border-radius:12px;padding:10px 12px;font-size:14px;display:grid;gap:7px}
.miss a{background:var(--wa);color:#fff;text-align:center;text-decoration:none;font-weight:700;border-radius:10px;padding:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns a{text-align:center;border-radius:10px;padding:11px 4px;font:700 14.5px var(--font);text-decoration:none}
.btns .p{background:var(--g);color:#fff}.btns .s{border:1.5px solid var(--g);color:var(--g);background:var(--card)}
.more{background:none;border:0;color:var(--brand);font:700 14.5px var(--font);padding:2px;cursor:pointer}
#det{position:fixed;inset:0;z-index:20;background:var(--soft);overflow-y:auto}
#det .in{max-width:640px;margin:0 auto;padding-bottom:96px}
.hero{background:linear-gradient(135deg,#1f4e79,#14324f);color:#fff;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.hero button{background:none;border:0;color:#fff;font:600 15px var(--font);padding:0;cursor:pointer;opacity:.9}
.hero h2{margin:10px 0 2px;font-size:24px;line-height:1.2}
.sec{background:var(--card);margin:10px 12px 0;border-radius:16px;padding:12px 14px}
.sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.li:last-child{border:0}.li span{color:var(--muted)}.li b{text-align:right}
.li a{color:var(--brand);font-weight:700;text-decoration:none}
.gauge{position:relative;height:10px;border-radius:10px;margin:18px 2px 6px;background:var(--line)}
.gauge .z{position:absolute;top:0;bottom:0;background:#86efac;border-radius:10px}
.gauge i{position:absolute;top:-6px;width:4px;height:22px;background:var(--brand);border-radius:2px;margin-left:-2px}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.pv{display:grid;gap:6px}.pv div{border-radius:10px;padding:8px 10px;font-size:14px}.pv ul{margin:4px 0 0;padding-left:18px}
.pos{background:var(--okbg);color:var(--ok)}.neg{background:var(--wabg);color:var(--wa)}
.desc{font-size:14.5px;margin:0}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.sticky .btns{max-width:640px;margin:0 auto}
.bar{position:sticky;bottom:0;z-index:6;background:var(--soft);padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.bar form{max-width:640px;margin:0 auto;display:flex;gap:8px}
.bar input{flex:1;min-width:0;border:0;border-radius:22px;padding:11px 15px;font:16px var(--font);background:var(--card);color:var(--ink)}
.bar button{width:44px;height:44px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:18px;cursor:pointer;flex:none}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:4px 12px 10px;margin:0}
</style>
<div class="app">
 <header class="hd"><div class="av">AF</div><div><b>Aste Flow</b><small>case all'asta in tutta Italia</small></div><button type="button" id="reset">Ricomincia</button></header>
 <main id="chat" aria-live="polite"></main>
 <p class="foot">Dati aggiornati al %%DATA%%. Valori OMI dell'Agenzia delle Entrate, 1° semestre 2026: dove non compaiono, la zona non risulta censita nelle tabelle OMI.</p>
 <div class="bar"><form id="f" autocomplete="off"><input id="q" placeholder="Scrivi un comune o una via…" aria-label="Cerca un comune o una via"><button aria-label="Invia">➤</button></form></div>
</div>
<div id="det" hidden><div class="in" id="detin"></div></div>
<div class="sticky" id="detbtn" hidden></div>
<script>
const IDX=%%IDX_JSON%%;const NUM="393272134718";
let A=[],REG=null,stato={},shown=0,lista=[];const cache={};
const mil=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');const eur=n=>n?mil(n)+' €':'—';
const dec=n=>String(n).replace('.',',');
const dt=s=>{const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const prima=s=>{const x=new Date(s+'T00:00:00');x.setDate(x.getDate()-1);return x.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})};
const giorni=s=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(s+'T00:00:00')-t)/864e5)-1};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tc=s=>String(s||'').toLowerCase().replace(/`/g,"'").replace(/(^|[\s(\-'])([a-zà-ù])/g,(m,p,c)=>p+c.toUpperCase());
const wa=t=>`https://wa.me/${NUM}?text=${encodeURIComponent(t)}`;
const ok=a=>a.q&&(a.k!=null||a.n!=null);
const sconto=a=>a.o&&a.m?Math.round((1-a.m/a.o)*100):null;
const affitto=a=>a.q&&a.w&&a.w.t==='z'&&a.w.la?Math.round((a.w.la+a.w.lb)/2*a.q):null;
const rend=a=>{if(a.xo)return null;const f=affitto(a);if(!f||!a.m)return null;const r=Math.round(f*12/a.m*1000)/10;return r>15?null:r};
function pulisci(L){L.forEach(a=>{const s=sconto(a);if(s!=null&&(s>60||s<-80)){a.o=null;a.xo=1}});return L}
const TIPI={ABITAZIONE_TIPO_CIV:'Appartamento civile',ABITAZIONE_TIPO_POP:'Appartamento popolare',ABITAZIONE_TIPO_ECO:'Appartamento economico',ABITAZIONE_TIPO_SIGNORILE:'Abitazione signorile',ABITAZIONE_IN_VILLINI:'Villino',ABITAZIONE_IN_VILLE:'Villa',VILLA:'Villa',APPARTAMENTO:'Appartamento',ABITAZIONE_TIPICA_LUOGHI:'Abitazione tipica',ABITAZIONE_TIPO_RURALE:'Casa rurale'};
const tipo=a=>{for(const x of (a.tb||'').split('|'))for(const k in TIPI)if(x.startsWith(k))return TIPI[k];return 'Abitazione'};
const pert=a=>{const t=a.tb||'',x=(a.x||'').toLowerCase();const p=[];if(/BOX|AUTORIMESSA|POSTO_AUTO/.test(t)||/\b(box|garage|posto auto|autorimessa)\b/.test(x))p.push('box/posto auto');if(/CANTINA/.test(t)||/\bcantina\b/.test(x))p.push('cantina');if(/giardino|corte esclusiva|corte esterna/.test(x))p.push('giardino/corte');if(/terrazz/.test(x))p.push('terrazzo');return p};
const pianoTxt=p=>{if(!p)return null;const s=String(p).trim();if(/^t$/i.test(s)||/terra/i.test(s))return 'Piano terra';if(/^\d+$/.test(s))return s+'° piano';return 'Piano '+s};
const SPIEGA={'Libero':'Libera: entri dopo il trasferimento della proprietà.','Occupato':'Occupata: in perizia si verifica se con contratto valido.','Occupato senza titolo':'Occupata senza titolo: la libera il custode del tribunale.','In liberazione':'Il custode sta già liberando la casa.'};
function zoneDi(r){let Z=[['tutte','Tutta la regione']];if(r==='Lazio')Z=Z.concat([['Roma nord','Roma nord'],['Roma est','Roma est'],['Roma sud','Roma sud'],['Roma ovest','Roma ovest'],['Ostia e litorale','Ostia e litorale'],['prov:Roma','Provincia di Roma (fuori città)']]);IDX[r].prov.filter(p=>p&&!(r==='Lazio'&&p==='Roma')).forEach(p=>Z.push(['prov:'+p,'Provincia di '+p]));return Z}
function match(a,o={}){const S=Object.assign({},stato,o);
 if(S.budget&&a.m>S.budget)return false;
 if(S.zona!=='tutte'){if(S.zona.startsWith('prov:')){const p=S.zona.slice(5);if(a.p!==p)return false;if(p==='Roma'&&a.c==='Roma'&&REG==='Lazio')return false}else if(a.z!==S.zona)return false}
 if(S.K&&a.k!=null&&a.k<S.K)return false;
 if(S.st==='lib'&&a.s!=='Libero')return false;
 if(S.st==='noocc'&&a.s==='Occupato senza titolo')return false;
 if(S.q&&!(a.v+' '+a.c+' '+a.p+' '+a.t).toLowerCase().includes(S.q))return false;
 return true}
const conta=o=>A.reduce((n,a)=>n+(match(a,o)?1:0),0);
const C=document.getElementById('chat');
const scroll=el=>setTimeout(()=>(el||C.lastElementChild)?.scrollIntoView({behavior:'smooth',block:'start'}),40);
function bot(h){const d=document.createElement('div');d.className='m in';d.innerHTML=h;C.appendChild(d);scroll(d);return d}
function me(t){const d=document.createElement('div');d.className='m out';d.textContent=t;C.appendChild(d)}
function chips(ops,cb,big){const w=document.createElement('div');w.className='qr'+(big?' big':'');
 ops.forEach(o=>{const b=document.createElement('button');b.type='button';b.innerHTML=big?`<i>${o.i}</i><span style="margin:0"><b>${esc(o.l)}</b><em>${esc(o.d||'')}</em></span>`:`${esc(o.l)}${o.n!=null?`<span>${mil(o.n)}</span>`:''}`;if(o.n===0)b.disabled=true;
  b.onclick=()=>{w.querySelectorAll('button').forEach(x=>x.disabled=true);b.style.opacity=1;me((o.i?o.i+' ':'')+o.l);cb(o.v,o)};w.appendChild(b)});C.appendChild(w);return w}
async function caricaRegione(r){REG=r;if(!cache[r]){const x=await fetch(IDX[r].f);if(!x.ok)throw 0;cache[r]=pulisci(await x.json())}A=cache[r]}
const PROF=[{v:'prima',i:'🏠',l:'Prima casa',d:'2 camere o più'},{v:'inv',i:'💰',l:'Investimento da affittare',d:'Ordinate per rendimento da affitto'},{v:'grande',i:'👨‍👩‍👧',l:'Casa grande per la famiglia',d:'3 camere o più'},{v:'io',i:'🔍',l:'Scelgo io',d:'Zona, budget, camere e stato'}];
function start(){C.innerHTML='';stato={prof:null,zona:'tutte',budget:0,K:0,st:'',ord:'d',q:''};REG=null;A=[];lista=[];
 const tot=Object.values(IDX).reduce((s,r)=>s+r.n,0);
 bot(`Ciao! 👋 Sono l'assistente di <b>Aste Flow</b>. Ti aiuto a trovare casa all'asta in pochi passaggi.`);
 bot(`Ci sono <b>${mil(tot)} case all'asta</b> con offerte aperte in Italia. Che casa stai cercando?`);
 chips(PROF,v=>{stato.prof=v;if(v==='prima')stato.K=2;if(v==='grande')stato.K=3;if(v==='inv')stato.ord='r';askReg()},true);window.scrollTo(0,0)}
function askReg(){bot('In quale regione cerchi?');const rs=Object.keys(IDX).sort((a,b)=>a.localeCompare(b,'it'));
 chips([...['Lazio','Lombardia'].filter(r=>IDX[r]).map(r=>({v:r,l:r,n:IDX[r].n})),{v:'altre',l:'Altre regioni ▾'}],async v=>{if(v==='altre'){chips(rs.filter(r=>r!=='Lazio'&&r!=='Lombardia').map(r=>({v:r,l:r,n:IDX[r].n})),r=>regScelta(r));scroll();return}regScelta(v)})}
async function regScelta(r){const t=document.createElement('div');t.className='typing';t.textContent='Carico le aste…';C.appendChild(t);
 try{await caricaRegione(r)}catch(e){t.remove();bot(`Non riesco a caricare le aste di ${esc(r)}. Riprova tra poco o <a href="${wa('Ciao, cerco casa all\'asta in '+r+'. Mi aiuti?')}" target="_blank" rel="noopener">scrivimi su WhatsApp</a>.`);return}
 t.remove();askZona()}
function askZona(){bot(`${esc(REG)}: <b>${mil(A.length)} aste</b>. In quale zona?`+(REG==='Lazio'?'<small>A Roma puoi scegliere il quadrante della città.</small>':''));
 chips(zoneDi(REG).map(([v,l])=>({v,l,n:conta({zona:v,budget:0})})).filter(o=>o.n>0||o.v==='tutte'),v=>{stato.zona=v;askBudget()})}
function askBudget(){const n=conta({budget:0});bot(`Qui ci sono <b>${mil(n)} aste</b>. Quanto puoi offrire al massimo?<small>Conta l'offerta minima, il prezzo più basso che il giudice accetta. Con l'offerta si versa una cauzione, di norma il 10%. Se ti serve il mutuo, verifichiamo prima quanto ti finanzia la banca.</small>`);
 chips([50000,80000,130000,200000,300000,0].map(b=>({v:b,l:b?'Fino a '+mil(b)+' €':'Non importa',n:conta({budget:b})})),v=>{stato.budget=+v;if(stato.prof==='io')askCam();else if(stato.prof==='prima')askStato();else risultati()})}
function askCam(){bot('Quante camere ti servono?<small>Le case che nell\'annuncio non le indicano restano nell\'elenco.</small>');
 chips([[0,'Non importa'],[1,'Almeno 1'],[2,'Almeno 2'],[3,'Almeno 3']].map(([k,l])=>({v:k,l,n:conta({K:k})})),v=>{stato.K=+v;askStato()})}
function askStato(){bot('La vuoi già libera?<small>Libera: entri dopo il trasferimento. Occupata: lo sgombero lo cura il custode del tribunale, ma i tempi possono allungarsi di qualche mese.</small>');
 chips([['','Va bene anche occupata'],['lib','Solo libere'],['noocc','Escludi le occupate senza titolo']].map(([v,l])=>({v,l,n:conta({st:v})})),v=>{stato.st=v;risultati()})}
function ordina(L){const o=stato.ord;const cmp=o==='m'?(x,y)=>x.m-y.m:o==='r'?(x,y)=>(rend(y)??-1)-(rend(x)??-1)||(sconto(y)??-999)-(sconto(x)??-999):(x,y)=>x.d.localeCompare(y.d);return L.slice().sort((x,y)=>((ok(y)?1:0)-(ok(x)?1:0))||cmp(x,y))}
function risultati(){lista=ordina(A.filter(a=>match(a)));shown=0;const nc=lista.filter(ok).length;
 if(!lista.length){bot(`Con questi criteri non trovo case. Prova ad alzare il budget o a scegliere tutta la regione, oppure <a href="${wa('Ciao, cerco casa all\'asta in '+REG+' ma non trovo quello che cerco. Mi aiuti?')}" target="_blank" rel="noopener">scrivimi su WhatsApp</a>.`);fine();return}
 bot(`Ho trovato <b>${mil(lista.length)} ${lista.length===1?'casa':'case'}</b>${nc?`. <b>${mil(nc)}</b> ${nc===1?'ha':'hanno'} metri quadri e camere: te le mostro per prime`:''}${stato.ord==='r'?', ordinate per rendimento da affitto':stato.ord==='m'?', dalla più economica':', dall\'asta più vicina'}.`);
 altre(true)}
function altre(first){const blocco=lista.slice(shown,shown+5);shown+=blocco.length;let primo=null;blocco.forEach(a=>{const d=document.createElement('div');d.innerHTML=card(a);const el=d.firstElementChild;C.appendChild(el);if(!primo)primo=el;el.querySelector('.more').onclick=()=>apri(a)});if(!first&&primo)scroll(primo);fine()}
function fine(){const ops=[];if(shown<lista.length)ops.push({v:'altre',l:`➡️ Altre ${Math.min(5,lista.length-shown)} case`});
 if(lista.length>1){if(stato.ord!=='m')ops.push({v:'m',l:'💶 Dalla più economica'});if(stato.ord!=='d')ops.push({v:'d',l:'📅 Dall\'asta più vicina'});if(stato.ord!=='r')ops.push({v:'r',l:'📈 Per rendimento'})}
 ops.push({v:'mutuo',l:'🏦 Mi serve il mutuo'},{v:'nuova',l:'🔄 Nuova ricerca'},{v:'call',l:'📞 Parla con un consulente'});
 chips(ops,v=>{if(v==='altre')altre();else if(v==='nuova')start();else if(v==='mutuo'){window.open(wa('Ciao, sto cercando casa all\'asta e mi serve il mutuo. Mi aiuti a capire quanto posso ottenere?'),'_blank','noopener');bot('Ti ho aperto WhatsApp con il messaggio pronto per il consulente.');fine()}else if(v==='call'){window.open(wa('Ciao, ho visto le aste su Aste Flow. Mi puoi chiamare per spiegarmi come funziona?'),'_blank','noopener');bot('Ti ho aperto WhatsApp: un consulente ti risponde e, se vuoi, ti chiama. La prima consulenza è gratuita.');fine()}else{stato.ord=v;risultati()}})}
const manca=a=>!a.q&&a.k==null&&a.n==null?'metri quadri e camere':!a.q?'metri quadri':'camere';
function card(a){const sc=sconto(a),f=affitto(a),r=rend(a),mqp=a.q&&a.m?Math.round(a.m/a.q):null,g=giorni(a.d);
